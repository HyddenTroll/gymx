name: Keep Supabase Awake + Notifications

on:
  schedule:
    - cron: '0 6,18 * * *'  # 6h et 18h UTC (8h et 20h Paris)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://dtpanyftiepcaiawrdml.supabase.co/rest/v1/" \
            -H "apikey: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
        timeout-minutes: 2

      - name: Check + send notifications
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://sport-beta-ebon.vercel.app/api/notifications/check"
        timeout-minutes: 5
